# ══════════════════════════════════════════════════════════
# Astra – Docker Compose (Produktion)
#
# Start:   ./scripts/deploy.sh            (empfohlen)
#   oder:  docker compose -f docker-compose.prod.yml up -d
#
# Setze COMPOSE_FILE=docker-compose.prod.yml in der .env, dann reicht
# ueberall ein einfaches `docker compose ...` (auch fuer scripts/backup.sh).
#
# WICHTIG: .env aus .env.prod.example erzeugen und Secrets setzen!
#
# Aufbau:
#   Internet :80/:443 -> caddy (TLS via Let's Encrypt)
#        PANEL_DOMAIN  -> frontend (Nginx, SPA + /api-Proxy) -> backend (Gunicorn)
#        NODE_DOMAIN   -> Wings auf dem Host :8080 (optional, siehe deploy/Caddyfile)
#   backend/worker    -> postgres, redis (nur intern)
# ══════════════════════════════════════════════════════════

x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-astra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-astra}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY muss gesetzt sein}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY muss gesetzt sein}
  BASE_URL: https://${PANEL_DOMAIN:?PANEL_DOMAIN muss gesetzt sein}
  FRONTEND_URL: https://${PANEL_DOMAIN}
  CORS_ORIGINS: https://${PANEL_DOMAIN}
  # Zwei Proxies vor dem Backend (Caddy -> Nginx) -> X-Forwarded-* zwei Hops
  PROXY_FIX_ENABLED: "true"
  PROXY_FIX_X_FOR: "2"
  PROXY_FIX_X_PROTO: "2"
  SESSION_COOKIE_SECURE: "true"
  RUNNER_ADAPTER: ${RUNNER_ADAPTER:-wings}
  RUNNER_TIMEOUT_CONNECT: ${RUNNER_TIMEOUT_CONNECT:-5}
  RUNNER_TIMEOUT_READ: ${RUNNER_TIMEOUT_READ:-30}
  JOB_QUEUE_BACKEND: ${JOB_QUEUE_BACKEND:-redis}
  RATELIMIT_ENABLED: "true"
  RATELIMIT_REGISTER_PER_HOUR: ${RATELIMIT_REGISTER_PER_HOUR:-5}
  RATELIMIT_LOGIN_PER_MINUTE: ${RATELIMIT_LOGIN_PER_MINUTE:-10}
  RATELIMIT_LOGIN_FAILURES_PER_HOUR: ${RATELIMIT_LOGIN_FAILURES_PER_HOUR:-20}
  RATELIMIT_PASSWORD_RESET_PER_HOUR: ${RATELIMIT_PASSWORD_RESET_PER_HOUR:-3}
  CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-none}
  CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
  CAPTCHA_SECRET: ${CAPTCHA_SECRET:-}
  REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
  PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-60}
  MAIL_SERVER: ${MAIL_SERVER:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-astra@${PANEL_DOMAIN}}
  SITE_NAME: ${SITE_NAME:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
  BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-7}
  BILLING_REMINDER_DAYS: ${BILLING_REMINDER_DAYS:-3}
  BILLING_TICK_MAX_AGE_MINUTES: ${BILLING_TICK_MAX_AGE_MINUTES:-15}
  BILLING_WAIT_WARN_HOURS: ${BILLING_WAIT_WARN_HOURS:-24}
  ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}
  ADMIN_ALERT_WEBHOOK_URL: ${ADMIN_ALERT_WEBHOOK_URL:-}
  ADMIN_ALERT_COOLDOWN_MINUTES: ${ADMIN_ALERT_COOLDOWN_MINUTES:-360}
  ADMIN_ALERT_RECOVERY: ${ADMIN_ALERT_RECOVERY:-true}
  INVOICE_NUMBER_FORMAT: ${INVOICE_NUMBER_FORMAT:-}  # leer = AST-{year}-{seq:05d}
  INVOICE_COUNTRY: ${INVOICE_COUNTRY:-DE}
  INVOICE_SELLER: ${INVOICE_SELLER:-}
  RECEIPT_FOOTER: ${RECEIPT_FOOTER:-}
  VAT_RATE: ${VAT_RATE:-0}
  INVOICE_SELLER_VAT_ID: ${INVOICE_SELLER_VAT_ID:-}
  INVOICE_SMALL_BUSINESS_NOTE: ${INVOICE_SMALL_BUSINESS_NOTE:-}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  LOG_LEVEL: ${LOG_LEVEL:-WARNING}

services:
  # ── Caddy: TLS-Terminierung + Reverse Proxy ───────────
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@${PANEL_DOMAIN}}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      # Erlaubt Caddy, Wings auf dem Host zu erreichen (NODE_DOMAIN -> host.docker.internal:8080)
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend

  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astra}
      POSTGRES_USER: ${POSTGRES_USER:-astra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astra} -d ${POSTGRES_DB:-astra}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Kein Port-Mapping in Produktion – nur intern erreichbar

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD muss gesetzt sein} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ── Backend (API) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
    image: astra-backend:local
    restart: always
    environment:
      <<: *backend-env
      AUTO_MIGRATE: "true"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["serve"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # ── Worker (Job-Queue: Webhooks, Routinen) ─────────────
  worker:
    image: astra-backend:local
    restart: always
    environment:
      <<: *backend-env
      AUTO_MIGRATE: "false"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["python", "cli.py", "worker", "--poll-interval", "1"]

  # ── Billing-Tick (Ablauf -> Sperre -> Loeschung, Verlaengerung) ──
  billing:
    image: astra-backend:local
    restart: always
    environment:
      <<: *backend-env
      AUTO_MIGRATE: "false"
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-7}
    depends_on:
      backend:
        condition: service_started
    # Alle 5 Minuten; Fehler einer Bestellung blockieren die anderen nicht (Exit 1 nur als Signal im Log)
    command: ["sh", "-c", "while true; do python cli.py billing-tick || echo '[billing] Tick mit Fehlern beendet'; sleep ${BILLING_TICK_INTERVAL:-300}; done"]

  # ── Admin-Alerts (M58): prueft unabhaengig vom Billing-Tick, ob dieser noch laeuft ──
  alerts:
    image: astra-backend:local
    restart: always
    environment:
      <<: *backend-env
      AUTO_MIGRATE: "false"
    depends_on:
      backend:
        condition: service_started
    command: ["sh", "-c", "while true; do python cli.py alert-check || echo '[alerts] alert-check fehlgeschlagen'; sleep ${ALERT_CHECK_INTERVAL:-300}; done"]

  # ── Frontend (Nginx: SPA + /api-Proxy zum Backend) ─────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: always
    depends_on:
      - backend
    # Kein Port-Mapping – Caddy ist der einzige oeffentliche Eingang

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
