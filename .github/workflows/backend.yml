name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Testskripte
        run: |
          fails=0
          for f in test_m*.py; do
            if ! python "$f" > "/tmp/$f.log" 2>&1; then
              echo "::error::FAIL $f"
              grep -E "FAIL|Error|Traceback" "/tmp/$f.log" | head -20
              fails=1
            else
              echo "PASS $f"
            fi
          done
          exit $fails

      - name: Migrationen (SQLite, frisch via db-init + Roundtrip)
        env:
          APP_ENV: production
          SECRET_KEY: ci-secret-key-only-for-tests
          JWT_SECRET_KEY: ci-jwt-key-only-for-tests
          DATABASE_URL: sqlite:////tmp/ci.db
          RUNNER_ADAPTER: stub
          JOB_QUEUE_BACKEND: sync
          FLASK_APP: run.py
        run: |
          python cli.py db-init
          flask db downgrade j0e1f2g3h4i5
          flask db upgrade
          flask db current
