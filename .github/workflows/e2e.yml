name: E2E

# Browser-Durchlauf gegen das echte Backend (SQLite, Stub-Runner, manuelle Zahlung):
# Registrierung -> Login -> Bestellung -> Admin markiert als bezahlt -> Server im Dashboard,
# danach axe-core (WCAG A/AA) auf den wichtigsten Seiten, dunkel/hell, 390 und 1100 px (e2e/a11y.mjs).
# Laeuft manuell (workflow_dispatch) und bei Aenderungen an den E2E-Dateien. Lokal: frontend/e2e/README.md
on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/e2e/**"
      - "frontend/src/**"
      - "design/tokens.css"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "frontend/e2e/**"
      - "frontend/src/**"
      - "design/tokens.css"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend-Abhaengigkeiten und Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright-core install --with-deps chromium

      - name: E2E-Durchlauf und Barrierefreiheit
        working-directory: frontend
        run: ./e2e/run-local.sh

      - name: Screenshots bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fehler
          path: frontend/e2e-fehler-*.png
          if-no-files-found: ignore
