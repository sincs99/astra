# ══════════════════════════════════════════════════════════
# Astra – Docker Compose (Entwicklung)
# Start: docker compose up
# ══════════════════════════════════════════════════════════

services:
  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: astra
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra
    ports:
      - "127.0.0.1:5432:5432"   # nur lokal, kein LAN-Zugriff auf die Dev-Datenbank
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   # nur lokal (Redis ohne Passwort)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"   # nur lokal; das Frontend-Image spricht das Backend intern an
    environment:
      APP_ENV: development
      FLASK_ENV: development
      DATABASE_URL: postgresql://astra:astra@postgres:5432/astra
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-docker
      JWT_SECRET_KEY: dev-jwt-secret-docker
      RUNNER_ADAPTER: ${RUNNER_ADAPTER:-stub}   # fuer Tests gegen echtes Wings: RUNNER_ADAPTER=wings docker compose up
      # Multi-Node-Tests: Wings auf einem anderen Host braucht die LAN-Adresse des Panels (remote, allowed_origins),
      # z. B. BASE_URL=http://192.168.1.7:3000 FRONTEND_URL=http://192.168.1.7:3000 docker compose up
      BASE_URL: ${BASE_URL:-http://localhost:5000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      AUTO_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Der Bind-Mount ueberdeckt das Image; "bash" davor, falls der Checkout kein Ausfuehrrecht traegt
    entrypoint: ["bash", "./entrypoint.sh"]
    command: ["serve"]

  # ── Frontend (Dev) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
