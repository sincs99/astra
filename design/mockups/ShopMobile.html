<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Astra – Shop, neuer Server (Handy)</title>
</head>
<body>
<!-- Referenz-Mockup aus dem Claude-Design-Canvas. Als Vorlage für Markup und Inline-Styles gedacht, nicht als fertiger Produktionscode. -->
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:#2bb8cc}a:hover{color:#5fd0e0}
.mono{font-family:'Geist Mono','JetBrains Mono',ui-monospace,monospace}
.step{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;padding:0;margin:0 0 10px}
.num{width:24px;height:24px;border-radius:50%;background:#1c232d;border:1px solid #2a313c;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#9aa5b4;flex:0 0 auto}
.pcard{background:#161b22;border:1px solid #2a313c;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;font:inherit;color:#e6e9ef;position:relative}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:#9aa5b4}
.inp{font:inherit;font-size:15px;height:44px;padding:0 12px;border-radius:6px;border:1px solid #2a313c;background:#1c232d;color:#e6e9ef;box-sizing:border-box;width:100%}
</style>
</helmet>
<div style="width: 390px; height: 1560px; box-sizing: border-box; background: #0f1419; color: #e6e9ef; font-family: Geist, Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 10px 16px; border-bottom: 1px solid #2a313c; background: #161b22">
    <a href="#top" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #e6e9ef"><svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3 L18.6 13.4 L29 16 L18.6 18.6 L16 29 L13.4 18.6 L3 16 L13.4 13.4 Z" fill="#2bb8cc"/><circle cx="26" cy="6" r="2.4" fill="#e6e9ef"/></svg><span style="font-size: 18px; font-weight: 600; letter-spacing: -0.03em">Astra</span></a>
    <button type="button" aria-label="Menü" style="width: 44px; height: 44px; border-radius: 6px; border: 0; background: transparent; color: #e6e9ef; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>

  <main style="padding: 16px; display: flex; flex-direction: column; gap: 22px; flex: 1 1 auto">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Neuer Server</h1>
      <span style="color: #9aa5b4; font-size: 13px">Paket, Spiel, Zahlung – fertig.</span>
    </div>

    <fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px">
      <legend class="step"><span class="num">1</span>Paket</legend>
      <label class="pcard" for="m-start"><input id="m-start" type="radio" name="paket" style="position: absolute; opacity: 0; width: 1px; height: 1px"><span style="display: flex; justify-content: space-between"><span style="font-weight: 600">Start</span><span class="mono">[PREIS] €</span></span><span style="font-size: 13px; color: #9aa5b4">4 GB · 10 Spieler · 20 GB</span></label>
      <label class="pcard" for="m-crew" style="border-color: #2bb8cc; background: rgba(43,184,204,.08); box-shadow: 0 0 0 1px #2bb8cc inset"><input id="m-crew" type="radio" name="paket" checked style="position: absolute; opacity: 0; width: 1px; height: 1px"><span style="display: flex; justify-content: space-between"><span style="font-weight: 600; display: inline-flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2bb8cc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>Crew</span><span class="mono">[PREIS] €</span></span><span style="font-size: 13px; color: #9aa5b4">8 GB · 25 Spieler · 50 GB</span></label>
      <label class="pcard" for="m-comm"><input id="m-comm" type="radio" name="paket" style="position: absolute; opacity: 0; width: 1px; height: 1px"><span style="display: flex; justify-content: space-between"><span style="font-weight: 600">Community</span><span class="mono">[PREIS] €</span></span><span style="font-size: 13px; color: #9aa5b4">16 GB · 60 Spieler · 120 GB</span></label>
    </fieldset>

    <fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px">
      <legend class="step"><span class="num">2</span>Spiel und Name</legend>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="m-spiel" style="font-size: 13px; font-weight: 500">Spiel</label>
        <div style="position: relative">
          <select id="m-spiel" class="inp" style="appearance: none; -webkit-appearance: none; padding-right: 32px"><option>Minecraft – Paper 1.21</option><option>Valheim</option><option>Satisfactory</option></select>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aa5b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 12px; top: 14px; pointer-events: none"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="m-name" style="font-size: 13px; font-weight: 500">Servername</label>
        <input id="m-name" class="inp" type="text" value="Freitagsrunde 2">
      </div>
    </fieldset>

    <fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px">
      <legend class="step"><span class="num">3</span>Zahlungsweg</legend>
      <label for="m-karte" class="pcard" style="border-color: #2bb8cc; box-shadow: 0 0 0 1px #2bb8cc inset; gap: 10px">
        <input id="m-karte" type="radio" name="zahlung" checked style="position: absolute; opacity: 0; width: 1px; height: 1px">
        <span style="display: flex; align-items: center; gap: 10px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2bb8cc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>Karte, Apple Pay, Google Pay</span>
        <span style="font-size: 13px; color: #9aa5b4">Sofort aktiv. Über Stripe, Astra sieht keine Kartendaten.</span>
      </label>
      <label for="m-ueberw" class="pcard" style="gap: 10px">
        <input id="m-ueberw" type="radio" name="zahlung" style="position: absolute; opacity: 0; width: 1px; height: 1px">
        <span style="display: flex; align-items: center; gap: 10px; font-weight: 600"><span style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid #7d8794; box-sizing: border-box; display: inline-block"></span>Überweisung</span>
        <span style="font-size: 13px; color: #9aa5b4">Start nach Zahlungseingang, meist 1–2 Werktage.</span>
        <div style="display: flex; flex-direction: column; gap: 4px; background: #0a0d12; border: 1px solid #2a313c; border-radius: 6px; padding: 10px 12px">
          <span class="kv"><span>IBAN</span><span class="mono" style="color: #e6e9ef">[IBAN]</span></span>
          <span class="kv"><span>Zweck</span><span class="mono" style="color: #e6e9ef">ASTRA-0420-M3</span></span>
        </div>
      </label>
    </fieldset>

    <div style="margin-top: auto; background: #161b22; border: 1px solid #2a313c; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
      <div class="kv"><span>Crew · Minecraft · Freitagsrunde 2</span><span style="color: #e6e9ef">1 Monat</span></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-weight: 500">Gesamt inkl. MwSt.</span><span class="mono" style="font-size: 22px; font-weight: 500">[PREIS] €</span></div>
      <button type="button" style="font: inherit; font-weight: 500; font-size: 15px; height: 48px; border-radius: 6px; border: 0; background: #2bb8cc; color: #0b1118; cursor: pointer">Weiter zur Zahlung</button>
      <span style="font-size: 12px; color: #7d8794; text-align: center">Bestätigung per E-Mail. Kein Abo.</span>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
